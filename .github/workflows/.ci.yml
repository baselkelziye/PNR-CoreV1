name: Run Cocotb Tests with Docker

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/andrei-md/pnr-corev1/cocotb-env:latest

    permissions:
      contents: read
      packages: read
      checks: write
      pull-requests: read

    steps:
    # Checkout repository code into the container's workspace
      - name: Checkout repository
        uses: actions/checkout@v4
    
    # Run the cocotb tests using Makefile
      - name: Run Cocotb tests
        run: |
          cd tests/cocotb
          make
    
    # Publish the test results
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: tests/cocotb/results.xml
          check_name: "Cocotb Simulation Results"